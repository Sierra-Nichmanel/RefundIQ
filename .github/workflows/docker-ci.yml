
name: RefundIQ Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-compose-test:
    name: Build and test Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_PASSWORD: ci_test_password_123456789
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CI_Test_Admin_Password_123!
      JWT_SECRET: ci_test_jwt_secret_change_me_1234567890123456789012345678901234567890

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start PostgreSQL and application
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T database \
              pg_isready -U refundiq_user -d refundiq; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          docker compose logs database
          exit 1

      - name: Check migration and backend startup
        run: |
          for i in {1..30}; do
            if docker compose logs backend 2>&1 \
              | grep -q "RefundIQ API running on port 5000"; then
              echo "Backend startup detected"
              exit 0
            fi

            if [ "$(docker compose inspect -f '{{.State.Status}}' backend)" = "exited" ]; then
              echo "Backend container exited unexpectedly"
              docker compose logs backend
              exit 1
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend startup timed out"
          docker compose logs backend
          exit 1

      - name: Seed synthetic test data
        run: |
          docker compose exec -T backend npx prisma db seed

      - name: Test refund API policy decisions
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://localhost:5000/api"

          submit_refund() {
            local name="$1"
            local order="$2"
            local email="$3"
            local reason="$4"
            local expected_status="$5"

            echo "Testing: $name"

            response=$(curl --silent --show-error \
              --write-out "\n%{http_code}" \
              -X POST "$BASE_URL/refunds" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg orderNumber "$order" \
                --arg customerEmail "$email" \
                --arg reason "$reason" \
                '{orderNumber:$orderNumber,customerEmail:$customerEmail,reason:$reason}')")

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" != "201" ]; then
              echo "Expected HTTP 201, received $http_code"
              echo "$body"
              exit 1
            fi

            actual_status=$(echo "$body" | jq -r '.data.status')

            if [ "$actual_status" != "$expected_status" ]; then
              echo "Expected $expected_status, received $actual_status"
              echo "$body"
              exit 1
            fi

            echo "$name passed: $actual_status"
            echo "$body" | jq '{id: .data.id, orderNumber: .data.orderNumber, status: .data.status, aiClassification: .data.aiClassification}'
          }

          submit_refund \
            "Damaged item approval" \
            "RFQ-001-01" \
            "customer01@example.com" \
            "The headphones arrived damaged and broken." \
            "APPROVED"

          submit_refund \
            "Old order denial" \
            "RFQ-001-02" \
            "customer01@example.com" \
            "I want a refund for this order." \
            "DENIED"

          submit_refund \
            "Final sale denial" \
            "RFQ-003-02" \
            "customer03@example.com" \
            "I want to return this clearance jacket." \
            "DENIED"

          submit_refund \
            "High-value escalation" \
            "RFQ-002-01" \
            "customer02@example.com" \
            "The laptop has an issue and I need a refund." \
            "ESCALATED"

      - name: Test refund API validation and access control
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://localhost:5000/api"

          echo "Testing invalid request validation..."

          status=$(curl --silent --output /tmp/invalid.json \
            --write-out "%{http_code}" \
            -X POST "$BASE_URL/refunds" \
            -H "Content-Type: application/json" \
            -d '{"orderNumber":"","customerEmail":"invalid-email","reason":"Hi"}')

          if [ "$status" != "400" ]; then
            echo "Expected 400 for invalid input, received $status"
            cat /tmp/invalid.json
            exit 1
          fi

          echo "Invalid request validation passed."

          echo "Testing customer/order mismatch..."

          status=$(curl --silent --output /tmp/mismatch.json \
            --write-out "%{http_code}" \
            -X POST "$BASE_URL/refunds" \
            -H "Content-Type: application/json" \
            -d '{
              "orderNumber":"RFQ-001-01",
              "customerEmail":"customer02@example.com",
              "reason":"The item arrived damaged."
            }')

          if [ "$status" != "404" ]; then
            echo "Expected 404 for mismatched customer/order, received $status"
            cat /tmp/mismatch.json
            exit 1
          fi

          echo "Customer/order ownership validation passed."

          echo "Testing unauthenticated admin access..."

          status=$(curl --silent --output /tmp/admin-unauth.json \
            --write-out "%{http_code}" \
            "$BASE_URL/refunds")

          if [ "$status" != "401" ]; then
            echo "Expected 401 for unauthenticated admin request, received $status"
            cat /tmp/admin-unauth.json
            exit 1
          fi

          echo "Admin authentication protection passed."

      - name: Test authenticated admin review workflow
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://localhost:5000/api"
          COOKIE_JAR="/tmp/refundiq-admin-cookies.txt"

          echo "Testing admin login..."

          login_status=$(curl --silent --show-error \
            --cookie-jar "$COOKIE_JAR" \
            --output /tmp/admin-login.json \
            --write-out "%{http_code}" \
            -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg email "$ADMIN_EMAIL" \
              --arg password "$ADMIN_PASSWORD" \
              '{email:$email,password:$password}')")

          if [ "$login_status" != "200" ]; then
            echo "Admin login failed: HTTP $login_status"
            cat /tmp/admin-login.json
            exit 1
          fi

          echo "Admin login passed."

          echo "Testing authenticated session..."

          me_status=$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output /tmp/admin-me.json \
            --write-out "%{http_code}" \
            "$BASE_URL/auth/me")

          if [ "$me_status" != "200" ]; then
            echo "Expected HTTP 200 from /auth/me, received $me_status"
            cat /tmp/admin-me.json
            exit 1
          fi

          echo "Authenticated session passed."

          echo "Retrieving refund requests..."

          list_status=$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output /tmp/admin-refunds.json \
            --write-out "%{http_code}" \
            "$BASE_URL/refunds")

          if [ "$list_status" != "200" ]; then
            echo "Expected HTTP 200 from refund list, received $list_status"
            cat /tmp/admin-refunds.json
            exit 1
          fi

          refund_id=$(jq -r \
            '.data[] | select(.orderNumber == "RFQ-002-01") | .id' \
            /tmp/admin-refunds.json | head -n1)

          if [ -z "$refund_id" ]; then
            echo "Could not find the escalated refund request."
            cat /tmp/admin-refunds.json
            exit 1
          fi

          echo "Found escalated refund: $refund_id"

          echo "Testing admin review..."

          review_status=$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output /tmp/admin-review.json \
            --write-out "%{http_code}" \
            -X PATCH "$BASE_URL/refunds/$refund_id/review" \
            -H "Content-Type: application/json" \
            -d '{
              "decision":"APPROVED",
              "reviewNotes":"CI integration test review."
            }')

          if [ "$review_status" != "200" ]; then
            echo "Expected HTTP 200 from review, received $review_status"
            cat /tmp/admin-review.json
            exit 1
          fi

          review_decision=$(jq -r '.data.status' /tmp/admin-review.json)

          if [ "$review_decision" != "APPROVED" ]; then
            echo "Expected APPROVED, received $review_decision"
            cat /tmp/admin-review.json
            exit 1
          fi

          echo "Admin review passed."

          echo "Checking persisted review and audit history..."

          detail_status=$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output /tmp/admin-detail.json \
            --write-out "%{http_code}" \
            "$BASE_URL/refunds/$refund_id")

          if [ "$detail_status" != "200" ]; then
            echo "Expected HTTP 200 from refund detail, received $detail_status"
            cat /tmp/admin-detail.json
            exit 1
          fi

          jq -e '
            .data.status == "APPROVED"
            and .data.reviewedByAdmin != null
            and (.data.auditLogs | any(.action == "REFUND_REQUEST_REVIEWED"))
          ' /tmp/admin-detail.json > /dev/null

          echo "Review persistence and audit history passed."

          echo "Testing review conflict for non-escalated request..."

          normal_refund_id=$(jq -r \
            '.data[] | select(.orderNumber == "RFQ-001-01") | .id' \
            /tmp/admin-refunds.json | head -n1)

          conflict_status=$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output /tmp/review-conflict.json \
            --write-out "%{http_code}" \
            -X PATCH "$BASE_URL/refunds/$normal_refund_id/review" \
            -H "Content-Type: application/json" \
            -d '{
              "decision":"DENIED",
              "reviewNotes":"Should not be allowed."
            }')

          if [ "$conflict_status" != "409" ]; then
            echo "Expected HTTP 409, received $conflict_status"
            cat /tmp/review-conflict.json
            exit 1
          fi

          echo "Non-escalated review protection passed."

          echo "Testing logout..."

          logout_status=$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --cookie-jar "$COOKIE_JAR" \
            --output /tmp/admin-logout.json \
            --write-out "%{http_code}" \
            -X POST "$BASE_URL/auth/logout")

          if [ "$logout_status" != "200" ]; then
            echo "Expected HTTP 200 from logout, received $logout_status"
            cat /tmp/admin-logout.json
            exit 1
          fi

          after_logout=$(curl --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --output /tmp/admin-after-logout.json \
            --write-out "%{http_code}" \
            "$BASE_URL/auth/me")

          if [ "$after_logout" != "401" ]; then
            echo "Expected HTTP 401 after logout, received $after_logout"
            cat /tmp/admin-after-logout.json
            exit 1
          fi

          echo "Logout and session invalidation passed."

      - name: Check backend HTTP health
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:5000/api/health; then
              echo ""
              echo "Backend HTTP health check passed"
              exit 0
            fi

            echo "Waiting for backend HTTP endpoint..."
            sleep 2
          done

          echo "Backend HTTP health check failed"
          docker compose logs backend
          exit 1

      - name: Check frontend HTTP availability
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:5173/ \
              -o /dev/null; then
              echo "Frontend HTTP check passed"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend HTTP check failed"
          docker compose logs frontend
          exit 1

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v